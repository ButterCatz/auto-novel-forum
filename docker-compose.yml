services:
  web:
    image: ghcr.io/auto-novel/forum-web:latest
    ports:
      - 5000:80
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --spider --tries=1 --no-verbose http://localhost || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/auto-novel/forum-api:latest
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - ACCESS_TOKEN_SECRET
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --spider --tries=1 --no-verbose http://localhost:8080/health || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:17.7-alpine3.23
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=forum
      - POSTGRES_DB=forum
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: forum
    driver: bridge
